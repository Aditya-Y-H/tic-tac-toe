<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
  </head>
  <body>
    <div class="game-bar">
      <div class="selection">
        <form action="">
          <div class="sub-form-container">
            <div class="input-container">
              <label for="player-1-name-input">Name</label>
              <input id="player-1-name-input" class="name-input" type="text" />
            </div>
            <div class="input-container">
              <label for="player-1-player-type">Type</label>
              <select name="player-1-player-type" id="player-1-player-type">
                <option value="human">Human</option>
                <option value="ai">AI</option>
              </select>
            </div>
          </div>
          <div class="sub-form-container">
            <div class="input-container">
              <label for="player-2-name-input">Name</label>
              <input id="player-2-name-input" class="name-input" type="text" />
            </div>
            <div class="input-container">
              <label for="player-2-player-type">Type</label>
              <select name="player-2-player-type" id="player-2-player-type">
                <option value="human">Human</option>
                <option value="ai">AI</option>
              </select>
            </div>
          </div>
          <button class="sub-form-container" id="play-btn" type="submit">
            Play
          </button>
        </form>
      </div>
      <div class="game">
        <div class="game-board">
          <button class="cell x-0 y-0">
            <div class="marker"></div>
          </button>
          <button class="cell x-1 y-0">
            <div class="marker"></div>
          </button>
          <button class="cell x-2 y-0">
            <div class="marker"></div>
          </button>

          <button class="cell x-0 y-1">
            <div class="marker"></div>
          </button>
          <button class="cell x-1 y-1">
            <div class="marker"></div>
          </button>
          <button class="cell x-2 y-1">
            <div class="marker"></div>
          </button>

          <button class="cell x-0 y-2">
            <div class="marker"></div>
          </button>
          <button class="cell x-1 y-2">
            <div class="marker"></div>
          </button>
          <button class="cell x-2 y-2">
            <div class="marker"></div>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
